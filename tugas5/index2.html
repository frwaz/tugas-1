<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toko Sederhana - Langkah 2: Filter Kategori</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
    :root{
        --brand:#0d6efd;
        --brand-dark:#084298;
    }
    body{
        background-color:#f4f6f9;
    }
    .navbar-brand{
        font-weight:700;
        letter-spacing:.5px;
    }
    .filter-bar{
        background:#fff;
        border-radius:10px;
        padding:1.25rem;
        box-shadow:0 2px 8px rgba(0,0,0,.06);
        margin-bottom:2rem;
    }
    .product-card{
        border:none;
        border-radius:12px;
        overflow:hidden;
        box-shadow:0 2px 6px rgba(0,0,0,.08);
        transition:transform .2s ease, box-shadow .2s ease;
        height:100%;
    }
    .product-card:hover{
        transform:translateY(-4px);
        box-shadow:0 8px 16px rgba(0,0,0,.12);
    }
    .product-image{
        height:190px;
        object-fit:cover;
        background:#eef1f5;
    }
    .badge-category{
        background-color:var(--brand);
    }
    .price-tag{
        color:#198754;
        font-weight:700;
        font-size:1.1rem;
    }
    #emptyState{
        display:none;
    }
</style>
</head>
<body>

<nav class="navbar navbar-dark" style="background-color:var(--brand-dark);">
    <div class="container">
        <span class="navbar-brand">🛒 Toko Sederhana</span>
    </div>
</nav>

<div class="container mt-4 mb-5">
    <h1 class="mb-1">Langkah 2: Filter Berdasarkan Kategori</h1>
    <p class="text-muted mb-4">
        Melanjutkan dari langkah 1, sekarang ditambahkan dropdown untuk menyaring
        produk berdasarkan kategori menggunakan <code>Array.filter()</code>.
    </p>

    <!-- Filter -->
    <div class="filter-bar">
        <div class="row g-3 align-items-end">
            <div class="col-md-6">
                <label for="categoryFilter" class="form-label fw-semibold">Filter berdasarkan Kategori</label>
                <select id="categoryFilter" class="form-select">
                    <option value="all">Semua Kategori</option>
                    <!-- opsi kategori akan ditambahkan otomatis oleh JavaScript -->
                </select>
            </div>
            <div class="col-md-6 text-md-end">
                <span id="resultCount" class="text-muted"></span>
            </div>
        </div>
    </div>

    <!-- Daftar produk -->
    <div class="row" id="productContainer">
        <!-- Kartu produk akan dimasukkan di sini oleh JavaScript -->
    </div>

    <div id="emptyState" class="text-center text-muted py-5">
        <p class="fs-5 mb-0">Tidak ada produk pada kategori ini.</p>
    </div>
</div>

<script>
    // 1. Array data produk: nama, harga, deskripsi, kategori, dan gambar
    const products = [
        { name: "Smartphone X10", price: 3500000, description: "Smartphone layar penuh dengan kamera 48MP", category: "Elektronik", image: "https://placehold.co/300x200?text=Smartphone" },
        { name: "Laptop Ultra", price: 8500000, description: "Laptop ringan untuk kerja dan kuliah", category: "Elektronik", image: "https://placehold.co/300x200?text=Laptop" },
        { name: "Headphone Wireless", price: 450000, description: "Headphone bluetooth dengan suara jernih", category: "Elektronik", image: "https://placehold.co/300x200?text=Headphone" },
        { name: "Kaos Polos Pria", price: 75000, description: "Kaos katun combed nyaman dipakai harian", category: "Pakaian", image: "https://placehold.co/300x200?text=Kaos" },
        { name: "Celana Jeans", price: 180000, description: "Celana jeans model slim fit", category: "Pakaian", image: "https://placehold.co/300x200?text=Jeans" },
        { name: "Jaket Hoodie", price: 220000, description: "Hoodie tebal cocok untuk cuaca dingin", category: "Pakaian", image: "https://placehold.co/300x200?text=Hoodie" },
        { name: "Novel Misteri", price: 65000, description: "Novel best seller genre misteri", category: "Buku", image: "https://placehold.co/300x200?text=Novel" },
        { name: "Buku Resep Masakan", price: 85000, description: "Kumpulan resep masakan rumahan", category: "Buku", image: "https://placehold.co/300x200?text=Resep" },
        { name: "Komik Petualangan", price: 45000, description: "Komik seru untuk semua umur", category: "Buku", image: "https://placehold.co/300x200?text=Komik" },
        { name: "Blender Mini", price: 250000, description: "Blender praktis untuk membuat jus", category: "Rumah Tangga", image: "https://placehold.co/300x200?text=Blender" },
        { name: "Setrika Listrik", price: 175000, description: "Setrika dengan pemanas cepat", category: "Rumah Tangga", image: "https://placehold.co/300x200?text=Setrika" },
        { name: "Rak Buku Minimalis", price: 320000, description: "Rak buku kayu 4 tingkat", category: "Rumah Tangga", image: "https://placehold.co/300x200?text=Rak+Buku" }
    ];

    const productContainer = document.getElementById('productContainer');
    const categoryFilter = document.getElementById('categoryFilter');
    const resultCount = document.getElementById('resultCount');
    const emptyState = document.getElementById('emptyState');

    function formatRupiah(number) {
        return 'Rp' + number.toLocaleString('id-ID');
    }

    // 2. Isi opsi kategori secara otomatis berdasarkan data produk (tanpa duplikat)
    function populateCategories() {
        const categories = [...new Set(products.map(p => p.category))];
        categories.forEach(cat => {
            const option = document.createElement('option');
            option.value = cat;
            option.textContent = cat;
            categoryFilter.appendChild(option);
        });
    }

    // 3. Tampilkan produk ke halaman menggunakan looping (forEach)
    function displayProducts(productList) {
        productContainer.innerHTML = '';

        emptyState.style.display = productList.length === 0 ? 'block' : 'none';

        productList.forEach(product => {
            const card = `
                <div class="col-sm-6 col-md-4 col-lg-3 mb-4">
                    <div class="card product-card">
                        <img src="${product.image}" class="card-img-top product-image" alt="${product.name}">
                        <div class="card-body d-flex flex-column">
                            <span class="badge badge-category text-white mb-2 align-self-start">${product.category}</span>
                            <h5 class="card-title">${product.name}</h5>
                            <p class="card-text text-muted small flex-grow-1">${product.description}</p>
                            <p class="price-tag mb-0">${formatRupiah(product.price)}</p>
                        </div>
                    </div>
                </div>
            `;
            productContainer.innerHTML += card;
        });

        resultCount.textContent = `${productList.length} produk ditemukan`;
    }

    // 4. Fitur filter sederhana berdasarkan kategori
    function filterByCategory() {
        const selected = categoryFilter.value;

        const filtered = selected === 'all'
            ? products
            : products.filter(product => product.category === selected);

        displayProducts(filtered);
    }

    categoryFilter.addEventListener('change', filterByCategory);

    // Inisialisasi halaman
    populateCategories();
    displayProducts(products);
</script>
</body>
</html>
